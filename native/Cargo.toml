[package]
name = "livevoicebridge_native"
# Development placeholder; release builds derive the version from the Git tag.
version = "0.0.0"
edition = "2021"
rust-version = "1.95"

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "*", features = ["abi3-py314"] }
sysinfo = "*"
rodio = { version = "*", default-features = false, features = ["playback", "wav", "mp3", "flac", "vorbis"] }
rusqlite = { version = "*", features = ["bundled", "fallible_uint"] }
serde = { version = "*", features = ["derive"] }
serde_json = "*"
csv = "*"
encoding_rs = "*"
encoding_rs_io = "*"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "*", features = [
    "Win32_Foundation",
    "Win32_System_Performance",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_Security",
    "Win32_System_ProcessStatus",
] }

[target.'cfg(target_os = "linux")'.dependencies]
nvml-wrapper = "*"
libc = "*"
