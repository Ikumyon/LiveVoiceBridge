name: quality

on:
  workflow_call:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYO3_PYTHON: python

jobs:
  static-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux audio build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Install Python check dependencies
        run: python .github/scripts/environment.py dev
      - name: Select project environment
        shell: python
        run: |
          import os
          import sys
          from pathlib import Path

          environment = Path('venv').resolve()
          scripts = environment / ('Scripts' if sys.platform == 'win32' else 'bin')
          python = scripts / ('python.exe' if sys.platform == 'win32' else 'python')
          with open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8') as output:
              output.write(str(scripts) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'VIRTUAL_ENV={environment}\nPYO3_PYTHON={python}\n')
      - name: Python lint and formatting
        run: |
          ruff check src services/qwen3/src .github/scripts examples/plugins
          ruff format --check src services/qwen3/src .github/scripts examples/plugins
      - name: Python type check
        run: mypy src/livevoicebridge services/qwen3/src .github/scripts examples/plugins
      - name: Update Rust dependencies
        run: cargo update --manifest-path native/Cargo.toml
      - name: Rust type check
        run: cargo check --locked --manifest-path native/Cargo.toml --all-targets
      - name: Rust formatting
        run: cargo fmt --manifest-path native/Cargo.toml -- --check
      - name: Rust lint
        run: cargo clippy --locked --manifest-path native/Cargo.toml --all-targets -- -D warnings
