name: quality

on:
  push:
  pull_request:

env:
  PYTHONUTF8: "1"
  PYO3_PYTHON: python

jobs:
  static-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux audio build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Install Python check dependencies
        run: >
          python -c "import pathlib,subprocess,sys,tomllib;
          p=tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project'];
          subprocess.check_call([sys.executable,'-m','pip','install',*p['dependencies'],*p['optional-dependencies']['dev']])"
      - name: Python lint and formatting
        run: |
          ruff check src tests services/qwen3/src tools
          ruff format --check src tests services/qwen3/src tools
      - name: Python type check
        run: mypy src/livevoicebridge tests services/qwen3/src
      - name: Rust type check
        run: cargo check --locked --manifest-path native/Cargo.toml --all-targets
      - name: Rust formatting
        run: cargo fmt --manifest-path native/Cargo.toml -- --check
      - name: Rust lint
        run: cargo clippy --locked --manifest-path native/Cargo.toml --all-targets -- -D warnings
