name: quality

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install test tools
        run: python -m pip install pytest pytest-qt ruff mypy maturin PySide6 requests emoji

      - name: Build native extension
        run: maturin build --release --manifest-path rust_native/Cargo.toml --out dist-test

      - name: Install native extension
        run: python -m pip install --find-links dist-test livevoicebridge-native

      - name: Python compile check
        run: python -m compileall -q main.py src tests

      - name: Python lint
        run: |
          ruff check main.py src tests
          ruff format --check main.py src tests

      - name: Python type check
        run: mypy main.py src/livevoicebridge tests

      - name: Python tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest

      - name: Rust formatting
        run: cargo fmt --manifest-path rust_native/Cargo.toml -- --check

      - name: Rust lint
        run: cargo clippy --manifest-path rust_native/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path rust_native/Cargo.toml
