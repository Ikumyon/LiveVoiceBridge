name: build

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: LiveVoiceBridge-Windows-x64.zip
          - os: ubuntu-22.04
            artifact: LiveVoiceBridge-Linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux audio and input plugin build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build extra-cmake-modules pkg-config git binutils patchelf \
            libasound2-dev libx11-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libgl-dev libegl1-mesa-dev libwayland-dev
      - name: Build and inspect distribution
        run: python .github/scripts/build.py ci
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'release'
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  attach-release:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Download distribution files
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --name LiveVoiceBridge-Windows-x64.zip --dir assets
          gh run download "$GITHUB_RUN_ID" --name LiveVoiceBridge-Linux-x64.tar.gz --dir assets
          test -s assets/LiveVoiceBridge-Windows-x64.zip
          test -s assets/LiveVoiceBridge-Linux-x64.tar.gz
      - name: Attach distribution files to published release
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            assets/LiveVoiceBridge-Windows-x64.zip \
            assets/LiveVoiceBridge-Linux-x64.tar.gz
      - name: Verify attached release assets
        shell: python
        run: |
          import json
          import os
          import subprocess
          from pathlib import Path
          from urllib.parse import quote

          endpoint = f"repos/{os.environ['GH_REPO']}/releases/tags/{quote(os.environ['RELEASE_TAG'], safe='')}"
          release = json.loads(subprocess.check_output(["gh", "api", endpoint], encoding="utf-8"))
          for path in Path("assets").iterdir():
              matches = [asset for asset in release["assets"] if asset["name"] == path.name]
              if len(matches) != 1 or matches[0]["state"] != "uploaded" or matches[0]["size"] != path.stat().st_size:
                  raise SystemExit(f"Release asset verification failed: {path.name}")
              print(f"Verified release asset: {path.name} ({matches[0]['size']} bytes)")
