name: build

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: LiveVoiceBridge-Windows-x64.zip
          - os: ubuntu-22.04
            artifact: LiveVoiceBridge-Linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux audio build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Build and inspect distribution
        run: python .github/scripts/build.py ci
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'release'
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  attach-release:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Download distribution files
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --name LiveVoiceBridge-Windows-x64.zip --dir assets
          gh run download "$GITHUB_RUN_ID" --name LiveVoiceBridge-Linux-x64.tar.gz --dir assets
          test -s assets/LiveVoiceBridge-Windows-x64.zip
          test -s assets/LiveVoiceBridge-Linux-x64.tar.gz
      - name: Attach distribution files to published release
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            assets/LiveVoiceBridge-Windows-x64.zip \
            assets/LiveVoiceBridge-Linux-x64.tar.gz
