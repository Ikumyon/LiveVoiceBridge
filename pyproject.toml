[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-config --strict-markers"
pythonpath = [".", "src"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["src/livevoicebridge/application/runtime.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = false
follow_imports = "skip"
ignore_missing_imports = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true
mypy_path = "src"
exclude = ["src/livevoicebridge/application/runtime.py"]
