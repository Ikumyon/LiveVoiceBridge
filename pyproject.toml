[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "livevoicebridge"
version = "0.99.2"
requires-python = ">=3.11"
description = "YouTube live chat to speech desktop application"
dependencies = ["PySide6", "requests", "grpcio>=1.81.1,<2", "protobuf>=6.33.5,<7", "pykakasi", "emoji"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-qt>=4.4,<5", "ruff>=0.12,<1", "mypy>=1.17,<2", "maturin>=1,<2", "grpcio-tools==1.81.1"]
package = ["pyinstaller>=6,<7"]

[project.gui-scripts]
livevoicebridge = "livevoicebridge.host.bootstrap:main"

[tool.maturin]
manifest-path = "native/Cargo.toml"
python-source = "src"
module-name = "livevoicebridge._native"
features = ["extension-module"]
include = ["src/livevoicebridge/desktop/resources/**/*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-config --strict-markers --basetemp=.test-runs/pytest"
pythonpath = ["src", "services/qwen3/src"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["src/livevoicebridge/integrations/youtube/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = false
follow_imports = "skip"
ignore_missing_imports = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true
mypy_path = "src"

exclude = ["integrations/youtube/generated/"]
