[build-system]
requires = ["maturin"]
build-backend = "maturin"

[project]
name = "livevoicebridge"
# Development placeholder; release builds derive the version from the Git tag.
version = "0.0.0"
requires-python = ">=3.14"
description = "YouTube live chat to speech desktop application"
# The generated YouTube bindings require these minimum runtime versions.
dependencies = ["PySide6", "requests", "grpcio>=1.84.1", "protobuf>=7.35.1", "pykakasi", "emoji"]

[project.optional-dependencies]
dev = ["ruff", "mypy", "maturin", "grpcio-tools"]
package = ["pyinstaller"]

[project.gui-scripts]
livevoicebridge = "livevoicebridge.host.bootstrap:main"

[tool.maturin]
manifest-path = "native/Cargo.toml"
python-source = "src"
module-name = "livevoicebridge._native"
features = ["extension-module"]
include = ["src/livevoicebridge/desktop/resources/**/*", "src/livevoicebridge/integrations/qwen/resources/**/*", "src/livevoicebridge/plugins/builtin/**/*"]

[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = ["src/livevoicebridge/integrations/youtube/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
disallow_untyped_defs = false
follow_imports = "skip"
ignore_missing_imports = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true
mypy_path = "src"

exclude = ["integrations/youtube/generated/"]
